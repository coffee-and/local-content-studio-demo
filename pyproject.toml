[project]
name = "local-content-studio-demo"
version = "0.1.0"
description = "PySide6 desktop portfolio demo for OpenAI content generation, OpenCV mosaic processing, SQLite history, and scheduling"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
